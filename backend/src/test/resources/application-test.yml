spring:
  datasource:
    url: jdbc:h2:mem:groundwork;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

groundwork:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-signing-1234567890
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
