spring:
  application:
    name: groundwork-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/groundwork}
    username: ${DATABASE_USERNAME:groundwork}
    password: ${DATABASE_PASSWORD:groundwork}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  # Render (and most PaaS) inject PORT; fall back to SERVER_PORT then 8080 locally.
  port: ${PORT:${SERVER_PORT:8080}}

groundwork:
  jwt:
    # Override JWT_SECRET in every real environment. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-groundwork-secret-key-change-me-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
